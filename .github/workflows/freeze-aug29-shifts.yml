name: Freeze August 29 Shifts

on:
  schedule:
    # TEMPORARY close-range test cron: 02:15 UTC Aug 8, 2026, to positively
    # confirm the schedule trigger actually fires (prior 8:30/9:00 PM windows
    # left no evidence either way of firing vs. not being live on main yet).
    # Revert to the real target time once confirmed.
    - cron: '15 2 8 8 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only, no changes'
        type: boolean
        default: false
      target_date:
        description: 'Date to freeze (YYYY-MM-DD)'
        type: string
        default: '2026-08-29'
      session_key:
        description: 'Optional: target a single session_key instead of target_date (for testing)'
        type: string
        default: ''
      freeze_value:
        description: 'Value to set frozen to'
        type: choice
        options:
          - 'Y'
          - 'N'
        default: 'Y'

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install
        # package-lock.json is gitignored in this repo, so `npm ci` (which
        # requires a committed lockfile) isn't usable here.

      - name: Run freeze script
        env:
          SCHED_API_KEY: ${{ secrets.SCHED_API_KEY }}
          TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_date || '2026-08-29' }}
          SESSION_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.session_key || '' }}
          FREEZE_VALUE: ${{ github.event_name == 'workflow_dispatch' && inputs.freeze_value || 'Y' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%F)" != "2026-08-08" ]; then
            echo "Not the intended one-time scheduled run date (2026-08-08 UTC); skipping to avoid an unintended annual re-run."
            exit 0
          fi
          node scripts/freeze-shifts.js
