name: Freeze August 29 Shifts

on:
  schedule:
    # TEMPORARY: every 5 minutes, so GitHub gets many chances to actually
    # dispatch the event instead of one single exact minute (single-minute
    # crons gave 3 windows - 8:30/9:00/9:15 PM CT - zero visible fires,
    # consistent with GitHub silently skipping an exact-minute schedule
    # under load with no retry). The run-window guard below keeps this from
    # actually doing anything outside a short bounded window. Revert once
    # a schedule-triggered run is confirmed in the Actions tab.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only, no changes'
        type: boolean
        default: false
      target_date:
        description: 'Date to freeze (YYYY-MM-DD)'
        type: string
        default: '2026-08-29'
      session_key:
        description: 'Optional: target a single session_key instead of target_date (for testing)'
        type: string
        default: ''
      freeze_value:
        description: 'Value to set frozen to'
        type: choice
        options:
          - 'Y'
          - 'N'
        default: 'Y'

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install
        # package-lock.json is gitignored in this repo, so `npm ci` (which
        # requires a committed lockfile) isn't usable here.

      - name: Run freeze script
        env:
          SCHED_API_KEY: ${{ secrets.SCHED_API_KEY }}
          TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_date || '2026-08-29' }}
          SESSION_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.session_key || '' }}
          FREEZE_VALUE: ${{ github.event_name == 'workflow_dispatch' && inputs.freeze_value || 'Y' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            NOW_EPOCH=$(date -u +%s)
            START_EPOCH=$(date -u -d '2026-08-08T02:15:00Z' +%s)
            END_EPOCH=$(date -u -d '2026-08-08T03:00:00Z' +%s)
            if [ "$NOW_EPOCH" -lt "$START_EPOCH" ] || [ "$NOW_EPOCH" -gt "$END_EPOCH" ]; then
              echo "Outside the intended one-time run window (2026-08-08 02:15-03:00 UTC); skipping so the every-5-min cron doesn't run all day."
              exit 0
            fi
          fi
          node scripts/freeze-shifts.js
