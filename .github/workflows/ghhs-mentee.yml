name: GHHS Mentee Assignment

# Runs:
#   - 28th of each month at 11:30 PM Central: creates next month's mentee
#     sessions and enrolls mentees
#   - Tue/Thu/Sat evenings at 11:30 PM Central: adds/removes mentees to match
#     mentor signup changes
# Every run is a full sync, so overlapping runs are harmless. The script works
# out which months to check from the Central-time date.
#
# Central Time is UTC-5 (CDT, Mar-Nov) or UTC-6 (CST, Nov-Mar).
# Using 04:30 UTC (11:30 PM during daylight saving, 10:30 PM during standard).
#
# 28th at 11:30 PM Central = 29th 04:30 UTC
#   (Feb 28 in non-leap years = Mar 1 04:30 UTC, hence the extra Mar 1 entry;
#    in leap years that run lands on Feb 29 Central and is a normal re-check)
# Tue 11:30 PM Central = Wed 04:30 UTC (day 3)
# Thu 11:30 PM Central = Fri 04:30 UTC (day 5)
# Sat 11:30 PM Central = Sun 04:30 UTC (day 0)

on:
  schedule:
    # 28th of each month
    - cron: '30 4 29 * *'
    - cron: '30 4 1 3 *'
    # Tue/Thu/Sat evenings (Wed/Fri/Sun UTC = Tue/Thu/Sat night Central)
    - cron: '30 4 * * 0,3,5'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only - do not create sessions or change enrollments'
        required: true
        type: boolean
        default: true
      run_date:
        description: 'Optional YYYY-MM-DD to run as if it were that date (blank = today)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  ghhs-mentee:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      # Download mentor-mentee CSV from private gist.
      # Setup: Add repository secret GHHS_GIST_ID with the gist ID from your gist URL.
      # Uses HISTORICAL_GIST_TOKEN (must have gist scope).
      - name: Download mentor-mentee CSV
        env:
          GIST_ID: ${{ secrets.GHHS_GIST_ID }}
          GIST_TOKEN: ${{ secrets.HISTORICAL_GIST_TOKEN }}
        run: |
          if [ -z "$GIST_ID" ] || [ -z "$GIST_TOKEN" ]; then
            echo "Gist secrets not configured - cannot proceed"
            exit 1
          fi
          curl -sL \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Accept: application/vnd.github.v3.raw" \
            "https://api.github.com/gists/$GIST_ID" \
            | jq -r '.files["ghhs_mentors.csv"].content' \
            > ghhs_mentors.csv
          echo "Downloaded mentor-mentee CSV ($(wc -l < ghhs_mentors.csv) lines)"

      - name: Sync GHHS mentees
        env:
          SCHED_API_KEY: ${{ secrets.SCHED_API_KEY }}
          SCHED_SUBDOMAIN: stvincentsclinic2025
          GHHS_CSV_PATH: ghhs_mentors.csv

          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          RUN_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_date || '' }}

          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

        run: node scripts/ghhs-mentee.js
