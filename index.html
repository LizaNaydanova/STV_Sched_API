<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sched.com API</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <h1>Sched.com API Interface</h1>

        <div class="section">
            <h2>API Key</h2>
            <input type="text" id="apiKey" placeholder="Enter your API Key">
        </div>

        <hr>

        <div class="section">
            <h2>Select Month</h2>
            <label for="month-select">Select Month and Year:</label>
            <input type="month" id="month-select" name="month-select">
            <button id="loadMonthBtn">Load Month</button>
        </div>

        <hr>

        <div class="section">
            <h2>Create Slots</h2>
            <button id="createLeadershipSlotsBtn">Create Leadership Slots</button>
            <button id="createGeneralSlotsBtn">Create General Volunteer Slots</button>
        </div>

        <hr>

        <div class="section">
            <h2>User Sessions</h2>
            <label for="username">Username:</label>
            <input type="text" id="username" placeholder="Enter username">
            <button id="getUserSessionsBtn">Get User Sessions</button>
        </div>

        <hr>

        <div class="section">
            <h2>User Tickets</h2>
            <label for="ticketEmail">Email:</label>
            <input type="email" id="ticketEmail" placeholder="Enter email address">
            <button id="getUserTicketsBtn">Get User Tickets</button>
        </div>

        <hr>

        <div class="section">
            <h2>Manage "New" Ticket</h2>
            <label for="ticketUsername">Username:</label>
            <input type="text" id="ticketUsername" placeholder="Enter username">
            <label for="ticketUserEmail">Email:</label>
            <input type="email" id="ticketUserEmail" placeholder="Enter email">
            <button id="addNewTicketBtn">Add "New" Ticket</button>
            <button id="deleteNewTicketBtn">Delete "New" Ticket</button>
        </div>

        <hr>

        <div class="section">
            <h2>Output</h2>
            <pre id="resultsOutput"></pre>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
